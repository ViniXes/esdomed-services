<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fuente del apple-icon (180x180): iOS aplica su propio redondeo de
       esquinas, así que va full-bleed (esquinas transparentes saldrían
       negras). El glifo va más grande que en el maskable (0.8 vs 0.62) porque
       aquí no hay zona segura que respetar. -->
  <rect width="100" height="100" fill="#1a4e70"/>
  <g transform="translate(50 50) scale(0.8) translate(-50 -50)">
    <line x1="22" y1="76" x2="78" y2="24" stroke="#ffffff" stroke-width="7"/>
    <circle cx="22" cy="76" r="13" fill="#ffffff"/>
    <circle cx="50" cy="50" r="13" fill="none" stroke="#4fc3dd" stroke-width="7"/>
    <circle cx="78" cy="24" r="13" fill="#ffffff"/>
  </g>
</svg>
