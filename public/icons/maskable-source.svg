<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fondo edge-to-edge (sin esquinas redondeadas propias): el SO aplica su
       propia máscara (círculo/squircle) sobre este ícono "maskable", así que el
       fondo debe llegar hasta el borde y el glifo debe caber en la zona segura
       central (~66% del lienzo) para no recortarse. Reusa el glifo de
       src/app/icon.svg (logo de trazabilidad), solo reescalado y centrado.
       OJO: nada de fill="rgba(...)" — Inkscape lo rasteriza negro. -->
  <rect width="100" height="100" fill="#1a4e70"/>
  <g transform="translate(50 50) scale(0.62) translate(-50 -50)">
    <line x1="22" y1="76" x2="78" y2="24" stroke="#ffffff" stroke-width="7"/>
    <circle cx="22" cy="76" r="13" fill="#ffffff"/>
    <circle cx="50" cy="50" r="13" fill="none" stroke="#4fc3dd" stroke-width="7"/>
    <circle cx="78" cy="24" r="13" fill="#ffffff"/>
  </g>
</svg>
