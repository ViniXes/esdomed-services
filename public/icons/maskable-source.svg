<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Fondo edge-to-edge (sin esquinas redondeadas propias): el SO aplica su
       propia máscara (círculo/squircle) sobre este ícono "maskable", así que el
       fondo debe llegar hasta el borde y el glifo debe caber en la zona segura
       central (~66% del lienzo) para no recortarse. Reusa el glifo de
       src/app/icon.svg (barras + línea ECG), solo reescalado y centrado. -->
  <rect width="32" height="32" fill="#1d4ed8"/>
  <g transform="translate(16,16) scale(0.62) translate(-16,-16)">
    <rect x="4"  y="20" width="6" height="9" rx="1.5" fill="#ffffff" fill-opacity="0.70"/>
    <rect x="13" y="13" width="6" height="16" rx="1.5" fill="#ffffff"/>
    <rect x="22" y="16" width="6" height="13" rx="1.5" fill="#ffffff" fill-opacity="0.82"/>
    <polyline
      points="3,10 7,10 9,4 11,15 13,6 16,10 29,10"
      stroke="#fb923c"
      stroke-width="1.8"
      fill="none"
      stroke-linecap="round"
      stroke-linejoin="round"/>
  </g>
</svg>
