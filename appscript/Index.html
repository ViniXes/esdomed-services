      color: #4b5563;
      margin-bottom: 4px;

    .acciones {

      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;

    button {

function escHTML_(valor) {
  return String(valor || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function mostrarBloqueCertificado() {
  const condicion = document.getElementById('condicionManual').value;
  const bloque = document.getElementById('bloqueCertificado');

  if (condicion === 'MUERTO') {
    bloque.classList.remove('oculto');
  } else {
    bloque.classList.add('oculto');
    document.getElementById('archivoCertificado').value = '';
  }
}

function leerArchivoPDF(file) {
  return new Promise((resolve, reject) => {
    if (!file) {
      reject(new Error('Archivo no seleccionado.'));
      return;
    }

    if (file.type !== 'application/pdf') {
      reject(new Error('El archivo debe ser PDF.'));
      return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {
      const dataUrl = e.target.result;
      const base64 = dataUrl.split(',')[1];

      resolve({
        nombre: file.name,
        mimeType: file.type,
        base64: base64
      });
    };

    reader.onerror = function() {
      reject(new Error('No se pudo leer el archivo.'));
    };

    reader.readAsDataURL(file);
  });
}

async function procesarDocumentos() {
  try {
    const condicion = document.getElementById('condicionManual').value;
    const fiehFile = document.getElementById('archivoFieh').files[0];
    const certFile = document.getElementById('archivoCertificado').files[0];

    if (!fiehFile) {
      mostrarEstado('Debe seleccionar el PDF FIEH.', 'error');
      return;
    }

    if (condicion === 'MUERTO' && !certFile) {
      mostrarEstado('Debe seleccionar el certificado de defunción para paciente fallecido.', 'error');
      return;
    }

    mostrarEstado('Leyendo documentos...', 'info');

    const fieh = await leerArchivoPDF(fiehFile);
    let certificado = null;

    if (condicion === 'MUERTO') {
      certificado = await leerArchivoPDF(certFile);
    }

    mostrarEstado('Subiendo y procesando documentos. Espere...', 'info');

    google.script.run
      .withSuccessHandler(manejarRespuesta)
      .withFailureHandler(err => {
        console.error('Error completo:', err);
        alert('ERROR CLIENTE/SERVIDOR:\n' + JSON.stringify(err, null, 2));
        mostrarEstado('Error: ' + (err.message || JSON.stringify(err)), 'error');
      })
      .apiProcesarDocumentos({
        condicionManual: condicion,
        fieh: fieh,
        certificado: certificado
      });

  } catch (err) {
    mostrarEstado('Error: ' + err.message, 'error');
  }
}

    function procesarTexto() {
      const texto = document.getElementById('textoManual').value.trim();

      if (!texto) {
        mostrarEstado('Debe pegar texto.', 'error');
        return;
      }

      mostrarEstado('Procesando texto...', 'info');

      google.script.run
        .withSuccessHandler(manejarRespuesta)
        .withFailureHandler(err => {
          mostrarEstado('Error: ' + err.message, 'error');
        })
        .apiProcesarTexto(texto);
    }

    function manejarRespuesta(resp) {
if (!resp || !resp.ok) {
  console.error('Respuesta completa del servidor:', resp);

  const detalle = resp
    ? JSON.stringify(resp, null, 2)
    : 'Respuesta vacía del servidor';

  mostrarEstado(

    grupo.campos.forEach(campo => {
      const el = document.getElementById('campo_' + campo);
      if (el) datos[campo] = String(el.value || '').trim();
    });
  });

  // Refuerzo directo para EDAD: SIMMOW solo debe recibir años.
  const campoEdad = document.getElementById('campo_EDAD_ANIOS');

  datos.EDAD_ANIOS = String(
    campoEdad ? campoEdad.value : datos.EDAD_ANIOS || ''
  )
    .replace(/[^\d]/g, '')
    .trim();

  // Alias de respaldo por si el servidor no recibe EDAD_ANIOS.
  datos.edad = datos.EDAD_ANIOS;

  datos.EDAD_ANIOS = String(datos.EDAD_ANIOS || '')
    .replace(/[^\d]/g, '')
    .trim();

  // Para SIMMOW solo se enviarán años cumplidos.
  datos.EDAD_MESES = '';
  datos.EDAD_DIAS = '';

  datos.edad = datos.EDAD_ANIOS;

  console.log('Datos recolectados antes de generar código:', datos);
  console.log('EDAD_ANIOS enviada:', datos.EDAD_ANIOS);

  datosActuales = datos;
  return datos;
}

function forzarEdadEnCodigo(codigo, edad) {
  const campoEdad = document.getElementById('campo_EDAD_ANIOS');

  const edadLimpia = String(
    edad ||
    (campoEdad ? campoEdad.value : '') ||
    datosActuales.EDAD_ANIOS ||
    datosActuales.edad ||
    ''
  )
    .replace(/[^\d]/g, '')
    .trim();

  if (!codigo || !edadLimpia) {
    return codigo;
  }

  // Reemplaza edad vacía dentro del objeto DATA generado por el GS.
  codigo = codigo.replace(
    /"edad"\s*:\s*""/,
    `"edad": "${edadLimpia}"`
  );

  codigo = codigo.replace(
    /"edad"\s*:\s*null/,
    `"edad": "${edadLimpia}"`
  );

  return codigo;
}

function generarCodigoActualizado() {
  const datos = recolectarDatos();
  const campoEdad = document.getElementById('campo_EDAD_ANIOS');

  const edadUI = String(
    datos.EDAD_ANIOS ||
    datos.edad ||
    (campoEdad ? campoEdad.value : '') ||
    ''
  )
    .replace(/[^\d]/g, '')
    .trim();

  if (!edadUI) {
    alert('EDAD_ANIOS está vacío. Escriba la edad en años antes de generar el código.');
    mostrarEstado('No se puede generar código sin EDAD_ANIOS.', 'error');
    return;
  }

  mostrarEstado('Generando código actualizado...', 'info');

  google.script.run
    .withSuccessHandler(resp => {
      if (!resp || !resp.ok) {
        mostrarEstado('No se pudo generar código.', 'error');
        return;
      }

      let codigo = resp.codigo || '';

      // FORZAR edad directamente en el código generado.
      codigo = forzarEdadEnCodigo(codigo, edadUI);

      codigoActual = codigo;
      renderCodigo(codigoActual);

      const tieneEdad = /"edad"\s*:\s*"\d+"/.test(codigoActual);

      if (!tieneEdad) {
        alert('El código generado todavía salió sin edad. No lo copie. Revise EDAD_ANIOS.');
        mostrarEstado('Código generado sin edad. No copiar.', 'error');
        return;
      }

      console.log('Código generado con edad forzada:', edadUI);
      mostrarEstado('Código actualizado correctamente con edad: ' + edadUI, 'ok');
    })
    .withFailureHandler(err => {
      console.error('Error completo:', err);
      alert('ERROR CLIENTE/SERVIDOR:\n' + JSON.stringify(err, null, 2));
      mostrarEstado('Error: ' + (err.message || JSON.stringify(err)), 'error');
    })
    .apiGenerarCodigo(datos);
}

    function renderCodigo(codigo) {
      document.getElementById('panelCodigo').classList.remove('oculto');
      document.getElementById('codigoConsola').textContent = codigo || '';
    }

function copiarCodigo() {
  let codigo = document.getElementById('codigoConsola').textContent;

  if (!codigo) {
    mostrarEstado('No hay código para copiar.', 'error');
    return;
  }

  const campoEdad = document.getElementById('campo_EDAD_ANIOS');

  const edadUI = String(
    (campoEdad ? campoEdad.value : '') ||
    datosActuales.EDAD_ANIOS ||
    datosActuales.edad ||
    ''
  )
    .replace(/[^\d]/g, '')
    .trim();

  codigo = forzarEdadEnCodigo(codigo, edadUI);

  if (!/"edad"\s*:\s*"\d+"/.test(codigo)) {
    alert('No se copiará el código porque la edad sigue vacía. Revise EDAD_ANIOS.');
    mostrarEstado('Código sin edad. No copiado.', 'error');
    return;
  }

  codigoActual = codigo;
  renderCodigo(codigoActual);

  navigator.clipboard.writeText(codigoActual)
    .then(() => mostrarEstado('Código copiado con edad: ' + edadUI, 'ok'))
    .catch(() => mostrarEstado('No se pudo copiar. Use Seleccionar código y Ctrl + C.', 'error'));
}

function seleccionarCodigo() {
  const pre = document.getElementById('codigoConsola');

  if (!pre || !pre.textContent) {
    mostrarEstado('No hay codigo para seleccionar.', 'error');
    return;
  }

  const range = document.createRange();
  range.selectNodeContents(pre);

  const selection = window.getSelection();
  selection.removeAllRanges();
  selection.addRange(range);

  mostrarEstado('Codigo seleccionado. Presione Ctrl + C.', 'ok');
}

function limpiarTodo() {
  const archivoFieh = document.getElementById('archivoFieh');
  const archivoCertificado = document.getElementById('archivoCertificado');
  const textoManual = document.getElementById('textoManual');

  if (archivoFieh) archivoFieh.value = '';
  if (archivoCertificado) archivoCertificado.value = '';
  if (textoManual) textoManual.value = '';

  document.getElementById('panelDatos').classList.add('oculto');
  document.getElementById('panelCodigo').classList.add('oculto');
  document.getElementById('panelAdvertencias').classList.add('oculto');
  document.getElementById('contenedorDatos').innerHTML = '';
  document.getElementById('codigoConsola').textContent = '';

  datosActuales = {};
  codigoActual = '';

  mostrarEstado('Limpio.', 'info');
}

    function mostrarEstado(msg, tipo) {
      const estado = document.getElementById('estado');
      estado.textContent = msg;

      if (tipo === 'ok') estado.style.color = '#047857';
      else if (tipo === 'error') estado.style.color = '#b91c1c';
      else estado.style.color = '#4b5563';
    }
  </script>
