<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Logo de trazabilidad (public/1c-trazabilidad-*.svg) sobre placa del
       mismo azul del logo: sin placa, el trazo oscuro se pierde en pestañas
       con tema oscuro. El trazo pasa a blanco y el anillo central usa un teal
       aclarado (#4fc3dd) porque el original (#2b8ca8) no contrasta sobre el
       azul de fondo. OJO: nada de fill="rgba(...)" — Inkscape lo rasteriza
       negro; usar fill-opacity si hiciera falta transparencia. -->
  <rect width="100" height="100" rx="22" fill="#1a4e70"/>
  <g transform="translate(50 50) scale(0.85) translate(-50 -50)">
    <line x1="22" y1="76" x2="78" y2="24" stroke="#ffffff" stroke-width="7"/>
    <circle cx="22" cy="76" r="13" fill="#ffffff"/>
    <circle cx="50" cy="50" r="13" fill="none" stroke="#4fc3dd" stroke-width="7"/>
    <circle cx="78" cy="24" r="13" fill="#ffffff"/>
  </g>
</svg>
